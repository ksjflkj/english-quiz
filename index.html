<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="英语题库练习系统 - 计算机与物联网专业英语练习">
    <title>英语刷题系统 | English Quiz Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- 粒子背景 -->
        <div class="particles" id="particles"></div>

        <!-- 头部导航 -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📚</span>
                    <span class="logo-text">English Quiz</span>
                </div>
                <nav class="nav-links">
                    <a href="#" class="nav-link active" data-mode="practice">练习模式</a>
                    <a href="#" class="nav-link" data-mode="exam">考试模式</a>
                </nav>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 开始页面 -->
            <section class="start-screen" id="startScreen">
                <div class="glass-card start-card">
                    <div class="start-icon">🎯</div>
                    <h1 class="start-title">计算机专业英语练习</h1>
                    <p class="start-subtitle">Computer & IoT English Quiz Practice Lab</p>

                    <div class="quiz-stats">
                        <div class="stat-item">
                            <span class="stat-value" id="totalQuestions">0</span>
                            <span class="stat-label">总题数</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="multipleCount">0</span>
                            <span class="stat-label">选择题</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="tfCount">0</span>
                            <span class="stat-label">判断题</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="fillBlankCount">0</span>
                            <span class="stat-label">填空题</span>
                        </div>
                    </div>

                    <div class="question-type-selector">
                        <h3>选择题型</h3>
                        <div class="type-options">
                            <label class="type-option">
                                <input type="checkbox" id="includeMultiple" checked>
                                <span class="checkmark"></span>
                                <span class="option-text">选择题</span>
                            </label>
                            <label class="type-option">
                                <input type="checkbox" id="includeTF" checked>
                                <span class="checkmark"></span>
                                <span class="option-text">判断题</span>
                            </label>
                            <label class="type-option">
                                <input type="checkbox" id="includeFillBlank" checked>
                                <span class="checkmark"></span>
                                <span class="option-text">填空题</span>
                            </label>
                        </div>
                    </div>

                    <div class="question-count-selector">
                        <h3>题目数量</h3>
                        <div class="count-options">
                            <button class="count-btn" data-count="10">10题</button>
                            <button class="count-btn active" data-count="20">20题</button>
                            <button class="count-btn" data-count="50">50题</button>
                            <button class="count-btn" data-count="all">全部</button>
                        </div>
                    </div>

                    <button class="start-btn" id="startBtn">
                        <span>开始答题</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </section>

            <!-- 答题区域 -->
            <section class="quiz-screen" id="quizScreen" style="display: none;">
                <div class="quiz-header">
                    <div class="progress-info">
                        <span class="current-question">题目 <span id="currentNum">1</span> / <span
                                id="totalNum">20</span></span>
                        <div class="timer-display" id="timerDisplay" style="display: none;">
                            <span class="timer-icon">⏱️</span>
                            <span class="timer-value">00:00</span>
                        </div>
                        <div class="score-display">
                            <span class="correct-count">✓ <span id="correctCount">0</span></span>
                            <span class="wrong-count">✗ <span id="wrongCount">0</span></span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="question-card glass-card" id="questionCard">
                    <div class="question-type-badge" id="questionTypeBadge">选择题</div>

                    <!-- 填空题词库 -->
                    <div class="word-bank-section" id="wordBankSection" style="display: none;">
                        <div class="word-bank-label">📝 词汇库 (Word Bank)</div>
                        <div class="word-bank" id="wordBank"></div>
                    </div>

                    <h2 class="question-text" id="questionText"></h2>

                    <div class="options-container" id="optionsContainer"></div>

                    <!-- 填空题输入区 -->
                    <div class="fill-blank-input-section" id="fillBlankInputSection" style="display: none;">
                        <div class="fill-blank-input-wrapper">
                            <input type="text" class="fill-blank-input" id="fillBlankInput" placeholder="点击词汇或输入答案..."
                                autocomplete="off">
                            <button class="submit-answer-btn" id="submitAnswerBtn">确认</button>
                        </div>
                    </div>

                    <div class="feedback-section" id="feedbackSection" style="display: none;">
                        <div class="feedback-content" id="feedbackContent"></div>
                    </div>
                </div>

                <div class="quiz-actions">
                    <button class="action-btn secondary" id="skipBtn">跳过</button>
                    <button class="action-btn primary" id="nextBtn" disabled>下一题</button>
                </div>
            </section>

            <!-- 结果页面 -->
            <section class="result-screen" id="resultScreen" style="display: none;">
                <div class="glass-card result-card">
                    <div class="result-icon" id="resultIcon">🎉</div>
                    <h1 class="result-title">答题完成！</h1>

                    <div class="score-circle">
                        <svg viewBox="0 0 100 100">
                            <circle class="score-bg" cx="50" cy="50" r="45" />
                            <circle class="score-progress" cx="50" cy="50" r="45" id="scoreCircle" />
                        </svg>
                        <div class="score-text">
                            <span class="score-value" id="scoreValue">0</span>
                            <span class="score-label">分</span>
                        </div>
                    </div>

                    <div class="result-stats">
                        <div class="result-stat correct">
                            <span class="stat-icon">✓</span>
                            <span class="stat-num" id="finalCorrect">0</span>
                            <span class="stat-text">正确</span>
                        </div>
                        <div class="result-stat wrong">
                            <span class="stat-icon">✗</span>
                            <span class="stat-num" id="finalWrong">0</span>
                            <span class="stat-text">错误</span>
                        </div>
                        <div class="result-stat skipped">
                            <span class="stat-icon">○</span>
                            <span class="stat-num" id="finalSkipped">0</span>
                            <span class="stat-text">跳过</span>
                        </div>
                    </div>

                    <div class="result-actions">
                        <button class="action-btn secondary" id="reviewBtn">查看错题</button>
                        <button class="action-btn primary" id="restartBtn">再来一次</button>
                    </div>
                </div>
            </section>

            <!-- 错题回顾 -->
            <section class="review-screen" id="reviewScreen" style="display: none;">
                <div class="review-header">
                    <button class="back-btn" id="closeReviewBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7" />
                        </svg>
                        <span>返回结果</span>
                    </button>
                    <h2>错题回顾</h2>
                    <div class="review-header-spacer"></div>
                </div>
                <div class="review-list" id="reviewList"></div>
                <div class="review-footer">
                    <button class="action-btn primary" id="backToResultBtn">返回结果页</button>
                </div>
            </section>
        </main>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>

</html>
